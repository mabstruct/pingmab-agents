<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Big Swallow</title>
<style>
  html,body{margin:0;height:100%;background:#050816;overflow:hidden;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#e8f2ff}
  canvas{display:block;width:100vw;height:100vh}
  .hud{position:fixed;inset:0;pointer-events:none}
  .panel{position:absolute;left:16px;top:14px;background:rgba(7,12,28,.42);backdrop-filter:blur(6px);border:1px solid rgba(160,200,255,.16);border-radius:12px;padding:10px 12px;min-width:240px;box-shadow:0 0 30px rgba(0,180,255,.06)}
  .title{font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:12px;color:#bfe6ff}
  .sub{font-size:11px;opacity:.75;margin-top:2px}
  .meta{margin-top:8px;font-size:12px;line-height:1.45;white-space:pre-line}
  .right{left:auto;right:16px;min-width:210px;text-align:right}
  .centerMsg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;padding:18px 22px;border-radius:16px;background:rgba(6,10,22,.56);border:1px solid rgba(160,200,255,.14);box-shadow:0 0 40px rgba(0,170,255,.08);max-width:min(560px,calc(100vw - 40px));}
  .centerMsg h1{margin:0 0 6px 0;font-size:22px;letter-spacing:.03em}
  .centerMsg p{margin:6px 0;font-size:13px;opacity:.88;line-height:1.5}
</style>
<script>(()=>{
const C=document.createElement('canvas'),X=C.getContext('2d');document.body.appendChild(C);
const hud=document.createElement('div');hud.className='hud';hud.innerHTML='<div class="panel"><div class="title">The Big Swallow</div><div class="sub">The Black Hole Breakfast Club</div><div class="meta" id="info"></div></div><div class="panel right"><div class="title">Controls</div><div class="meta">A/D or ←/→: rotate field\nSpace: pulse pull\nR: restart level\nEnter: next / start</div></div><div class="centerMsg" id="msg" style="display:none"></div>';document.body.appendChild(hud);
const info=document.getElementById('info'),msg=document.getElementById('msg'),TAU=Math.PI*2;const state={w:0,h:0,t:0,last:0,scene:'title',level:0,angle:0,targetAngle:0,shake:0,pulse:0,turns:0,score:0,particles:[],objects:[],levels:[],cx:0,cy:0,hole:0,ring:0};
function resize(){C.width=innerWidth*devicePixelRatio;C.height=innerHeight*devicePixelRatio;state.w=C.width;state.h=C.height;state.cx=state.w/2;state.cy=state.h/2;state.hole=Math.min(state.w,state.h)*.055;state.ring=state.hole*2.9}addEventListener('resize',resize);resize();
const mk=(type,x,y,r,opt={})=>({type,x,y,r,vx:opt.vx||0,vy:opt.vy||0,ang:opt.ang||0,spin:opt.spin||0,orbit:opt.orbit||0,alive:true});
state.levels=[{name:'First Bite',goal:'Swallow: Satellite → Planet',order:['sat','pla'],moves:5},{name:'Lunette',goal:'Swallow: Debris → Satellite → Planet',order:['deb','sat','pla'],moves:6},{name:'Gravity Dinner',goal:'Hold the orbit, then consume in order',order:['sat','pla','deb'],moves:7}];
function loadLevel(i){state.level=i;state.turns=0;state.pulse=0;state.angle=0;state.targetAngle=0;state.shake=0;state.objects=[];state.particles=[];const s=Math.min(state.w,state.h)*.5;const L=state.levels[i];L.order=L.name==='Lunette'?['deb','sat','pla']:L.name==='Gravity Dinner'?['sat','pla','deb']:['sat','pla'];state.objects.push(mk('sat',state.cx+s*.22,state.cy-s*.06,12,{vx:0,vy:70,spin:1.5,orbit:1}));state.objects.push(mk('pla',state.cx-s*.17,state.cy+s*.08,22,{vx:-55,vy:0,spin:.4}));state.objects.push(mk('deb',state.cx+s*.06,state.cy+s*.2,8,{vx:65,vy:-30,spin:3.5}));if(i===1)state.objects=[mk('deb',state.cx+s*.18,state.cy-s*.12,7,{vx:-20,vy:85,spin:3}),mk('sat',state.cx-s*.2,state.cy+s*.16,11,{vx:70,vy:10,spin:1.2,orbit:1}),mk('pla',state.cx+s*.03,state.cy+s*.03,24,{vx:-25,vy:-45,spin:.45})];if(i===2)state.objects=[mk('sat',state.cx+s*.05,state.cy-s*.22,11,{vx:80,vy:25,spin:1.5,orbit:1}),mk('pla',state.cx-s*.15,state.cy+s*.12,25,{vx:0,vy:-15,spin:.35}),mk('deb',state.cx+s*.19,state.cy+s*.15,8,{vx:-55,vy:-40,spin:4})]}
function puff(x,y,c,n){for(let i=0;i<n;i++)state.particles.push({x,y,vx:Math.cos(i/n*TAU+Math.random())*(30+Math.random()*110),vy:Math.sin(i/n*TAU+Math.random())*(30+Math.random()*110),life:.6+Math.random()*.4,r:1+Math.random()*3,c})}
function update(dt){state.t+=dt;if(state.scene!=='play'){for(const p of state.particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}state.particles=state.particles.filter(p=>p.life>0);return}state.angle+=(state.targetAngle-state.angle)*Math.min(1,dt*4);const grav=120*state.pulse;state.pulse=Math.max(0,state.pulse-dt*1.8);state.shake=Math.max(0,state.shake-dt*1.5);for(const o of state.objects){if(!o.alive)continue;const dx=state.cx-o.x,dy=state.cy-o.y,d=Math.hypot(dx,dy)+.001,pull=grav/(d*d)*2800; o.vx+=dx/d*pull*dt;o.vy+=dy/d*pull*dt;const rx=Math.cos(state.angle)*(o.x-state.cx)-Math.sin(state.angle)*(o.y-state.cy),ry=Math.sin(state.angle)*(o.x-state.cx)+Math.cos(state.angle)*(o.y-state.cy);o.vx+=(-rx*.06)*dt;o.vy+=(-ry*.06)*dt;o.x+=o.vx*dt;o.y+=o.vy*dt;o.ang+=(o.spin||0)*dt;if(d<state.hole+o.r*0.7){const want=state.levels[state.level].order[0];if(o.type===want){state.levels[state.level].order.shift();o.alive=false;state.shake=.35;puff(o.x,o.y,'#bdf8ff',18);if(state.levels[state.level].order.length===0){state.scene='win';msg.style.display='block';msg.innerHTML='<h1>Level Cleared</h1><p>Order preserved. The universe remains elegant.</p><p><b>Enter</b> for next level</p>'}}else{state.scene='lose';msg.style.display='block';msg.innerHTML='<h1>Order Broken</h1><p>That was not the next bite.</p><p><b>R</b> to retry</p>'}state.shake+=.2;}}for(const p of state.particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;p.vx*=.99;p.vy*=.99}state.particles=state.particles.filter(p=>p.life>0)}
function render(){const w=C.width,h=C.height;X.setTransform(1,0,0,1,0,0);X.clearRect(0,0,w,h);const g=X.createLinearGradient(0,0,0,h);g.addColorStop(0,'#07111f');g.addColorStop(1,'#03050b');X.fillStyle=g;X.fillRect(0,0,w,h);for(let i=0;i<80;i++){const x=i*97%w,y=i*193%h;X.fillStyle='rgba(180,220,255,.03)';X.fillRect(x,y,2,2)}const sh=state.shake*12;X.save();X.translate(sh*(Math.random()-.5),sh*(Math.random()-.5));X.translate(state.cx,state.cy);X.rotate(state.angle);X.translate(-state.cx,-state.cy);for(const p of state.particles){X.globalAlpha=Math.max(0,p.life);X.fillStyle=p.c;X.beginPath();X.arc(p.x,p.y,p.r,0,TAU);X.fill()}X.globalAlpha=1;for(const o of state.objects){if(!o.alive)continue;X.save();X.translate(o.x,o.y);X.rotate(o.ang);const grad=X.createRadialGradient(-o.r*.3,-o.r*.3,o.r*.2,0,0,o.r*1.6);grad.addColorStop(0,'rgba(255,255,255,.85)');grad.addColorStop(.35,o.type==='pla'?'#9db3ff':o.type==='sat'?'#b7ffea':'#ffdca8');grad.addColorStop(1,'rgba(0,0,0,0)');X.fillStyle=grad;X.beginPath();X.arc(0,0,o.r*1.55,0,TAU);X.fill();X.fillStyle=o.type==='pla'?'#1a2448':o.type==='sat'?'#17343a':'#3b2d1d';X.strokeStyle='rgba(200,230,255,.8)';X.lineWidth=2;X.beginPath();X.arc(0,0,o.r,0,TAU);X.fill();X.stroke();if(o.type==='sat'){X.strokeStyle='rgba(180,255,240,.8)';X.beginPath();X.arc(0,0,o.r*1.6,0,TAU);X.stroke()}if(o.type==='pla'){X.strokeStyle='rgba(140,175,255,.22)';X.beginPath();X.arc(0,0,o.r*1.35,0,TAU);X.stroke()}X.restore()}X.fillStyle='rgba(0,0,0,.98)';X.beginPath();X.arc(state.cx,state.cy,state.hole,0,TAU);X.fill();X.strokeStyle='rgba(120,220,255,.9)';X.lineWidth=2;X.beginPath();X.arc(state.cx,state.cy,state.hole*1.25,0,TAU);X.stroke();X.strokeStyle='rgba(120,220,255,.15)';X.lineWidth=10;X.beginPath();X.arc(state.cx,state.cy,state.ring,0,TAU);X.stroke();X.restore();info.textContent='Level '+(state.level+1)+'/'+state.levels.length+'\n'+state.levels[state.level].name+'\n'+state.levels[state.level].goal+'\nMoves: '+state.turns+'/'+state.levels[state.level].moves+'\nStar: '+Math.max(1,3-Math.max(0,state.turns-state.levels[state.level].moves))+'/3';if(state.scene==='title'){msg.style.display='block';msg.innerHTML='<h1>The Big Swallow</h1><p>The Black Hole Breakfast Club</p><p>Rotate the field, pulse gravity, and swallow the correct cosmic bite order.</p><p><b>Enter</b> to begin</p>'}else if(state.scene==='play'){msg.style.display='none'}}
function loop(ts){const dt=Math.min(.033,(ts-state.last)/1000||0);state.last=ts;update(dt);render();requestAnimationFrame(loop)}requestAnimationFrame(loop);addEventListener('keydown',e=>{if(e.repeat)return;if(e.key==='Enter'){if(state.scene==='title'){state.scene='play';loadLevel(0);msg.style.display='none'}else if(state.scene==='win'){if(state.level<state.levels.length-1){state.scene='play';loadLevel(state.level+1);msg.style.display='none'}else state.scene='title'}}if(e.key==='r'||e.key==='R'){state.scene='play';loadLevel(state.level);msg.style.display='none'}if(state.scene!=='play')return;if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A'){state.targetAngle-=Math.PI/8;state.turns++}if(e.key==='ArrowRight'||e.key==='d'||e.key==='D'){state.targetAngle+=Math.PI/8;state.turns++}if(e.key===' '){state.pulse=1;state.turns++}});loadLevel(0);state.scene='title';
})();
</script></body></html>
