<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>The Big Swallow</title>
<style>
  html,body{margin:0;padding:0;background:#05070d;overflow:hidden;height:100%;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#eaf2ff}
  canvas{display:block;width:100vw;height:100vh;image-rendering:auto;touch-action:none;cursor:pointer}
  .hud{position:fixed;left:0;top:0;width:100%;pointer-events:none;text-shadow:0 2px 10px rgba(0,0,0,.6)}
  .topbar{display:flex;justify-content:space-between;gap:12px;padding:12px 14px;font-weight:700;letter-spacing:.5px}
  .pill{background:rgba(10,16,28,.42);border:1px solid rgba(170,210,255,.18);backdrop-filter:blur(6px);border-radius:999px;padding:8px 12px}
  .center{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;width:min(92vw,760px)}
  .title{font-size:clamp(36px,7vw,78px);font-weight:900;letter-spacing:1px;line-height:.92;margin:0 0 6px}
  .subtitle{font-size:clamp(14px,2vw,20px);opacity:.92;margin:0 0 18px}
  .help{font-size:14px;opacity:.9;line-height:1.5;max-width:52ch;margin:0 auto}
  .small{font-size:12px;opacity:.8}
  .barWrap{width:min(320px,70vw);height:12px;background:rgba(255,255,255,.12);border-radius:999px;overflow:hidden;border:1px solid rgba(255,255,255,.14)}
  .bar{height:100%;width:0%;background:linear-gradient(90deg,#6ef,#ff6,#f66);box-shadow:0 0 18px rgba(120,220,255,.7)}
  .bottom{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);pointer-events:none;text-align:center;font-size:12px;opacity:.85}
</style>
<script>
(()=>{
const C=document.querySelector('canvas')||document.createElement('canvas');if(!C.parentNode)document.body.prepend(C);const X=C.getContext('2d');
const S={w:0,h:0,dpr:1,t:0,dt:0,state:'title',seed:(Date.now()%1e9)|0,score:0,best:+localStorage.getItem('bigSwallowBest')||0,combo:0,comboT:0,growth:0,stomach:0,biomeT:0,biome:0,speed:240,baseSpeed:240,spawn:0,worldX:0,flash:0,msg:'',msgT:0,lanes:3,creatureY:0,boost:0,invuln:0};
const P={down:false,press:false,startY:0};
const BIOMES=[{bg:['#060916','#12243d'],fg:'#7ff',accent:'#f7c',haz:'#ff6b6b'},{bg:['#170f08','#4a250f'],fg:'#ffd27d',accent:'#ff9f43',haz:'#c96'},{bg:['#08111a','#1d3557'],fg:'#e8f7ff',accent:'#9ef0ff',haz:'#7dffb3'}];
const objs=[];const RNG=()=>{S.seed=(S.seed*1664525+1013904223)>>>0;return S.seed/4294967296};
function resize(){S.dpr=Math.min(2,devicePixelRatio||1);S.w=innerWidth;S.h=innerHeight;C.width=S.w*S.dpr;C.height=S.h*S.dpr;C.style.width=S.w+'px';C.style.height=S.h+'px';X.setTransform(S.dpr,0,0,S.dpr,0,0);S.creatureY=S.h*0.72}
addEventListener('resize',resize);resize();
function reset(){S.score=0;S.combo=0;S.comboT=0;S.growth=.15;S.stomach=0;S.speed=240;S.baseSpeed=240;S.spawn=0;S.worldX=0;S.flash=0;S.msg='';S.msgT=0;S.boost=0;S.invuln=0;objs.length=0;S.biome=0;S.biomeT=0;S.state='play'}
function laneX(l){return S.w*(0.28+0.2*l)}
function spawn(){const b=BIOMES[S.biome],r=RNG();let t='edible',c=b.accent,s=1;if(r<.16){t='hazard';c=b.haz;s=1.15}else if(r<.34){t='heavy';c='#ffffff';s=1.45}else if(r<.5){t='toxic';c='#7cff63'}else{s=.9}const lane=(RNG()*S.lanes)|0;objs.push({x:S.w+90,y:laneX(lane),t,c,s,phase:RNG()*10,hit:false,val:t==='edible'?10:t==='heavy'?25:t==='toxic'?15:0})}
function swallow(o){o.hit=true;S.flash=.12;S.score+=o.val*(1+S.combo*0.15);S.combo++;S.comboT=1.1;S.growth=Math.min(1.6,S.growth+(o.t==='heavy'?0.09:0.04));S.stomach=Math.min(1,S.stomach+(o.t==='toxic'?0.34:o.t==='heavy'?0.22:.12));S.msg=o.t==='toxic'?'TOXIC':o.t==='heavy'?'HEAVY SWALLOW':'SWALLOW';S.msgT=.5;if(S.combo%6===0){S.boost=1.2;S.msg='CHAIN BURST';S.msgT=.7;S.score+=50*S.combo}}
function update(dt){if(S.state!=='play')return;S.t+=dt;S.worldX+=S.speed*dt;S.biomeT+=dt;if(S.biomeT>18){S.biomeT=0;S.biome=(S.biome+1)%BIOMES.length;S.lanes=2+((RNG()*3)|0)}S.comboT=Math.max(0,S.comboT-dt);if(S.comboT===0)S.combo=0;S.flash=Math.max(0,S.flash-dt);S.boost=Math.max(0,S.boost-dt);S.invuln=Math.max(0,S.invuln-dt);S.msgT=Math.max(0,S.msgT-dt);S.speed=S.baseSpeed+S.growth*160+(S.boost>0?180:0)-S.stomach*90;S.speed=Math.max(160,S.speed);S.score+=dt*S.speed*0.02;S.spawn-=dt;if(S.spawn<=0){S.spawn=0.45+Math.max(0,.6-S.speed/800);spawn();if(RNG()<.18)spawn()}for(const o of objs)o.x-=S.speed*dt;while(objs[0]&&objs[0].x<-120)objs.shift();for(const o of objs){const dx=Math.abs(o.x-S.w*0.33),dy=Math.abs(o.y-S.creatureY),reach=56+S.growth*36;if(!o.hit&&dx<reach+28&&dy<66){if(o.t==='hazard'||o.t==='toxic'&&S.growth<.5){if(S.invuln<=0){S.state='gameover';S.best=Math.max(S.best,S.score|0);localStorage.setItem('bigSwallowBest',S.best)}}else if(o.t==='heavy'&&S.growth<.75){if(P.press||P.down)swallow(o)}else swallow(o)}}if(S.stomach>1.05){S.state='gameover';S.best=Math.max(S.best,S.score|0);localStorage.setItem('bigSwallowBest',S.best)}}
function poly(x,y,r,n,col,rot=0){X.fillStyle=col;X.beginPath();for(let i=0;i<n;i++){const a=rot+i*6.283/n,px=x+Math.cos(a)*r*(0.8+0.2*Math.sin(i*2.1)),py=y+Math.sin(a)*r*(0.8+0.2*Math.cos(i*1.7));i?X.lineTo(px,py):X.moveTo(px,py)}X.closePath();X.fill()}
function drawBg(){const b=BIOMES[S.biome],g=X.createLinearGradient(0,0,0,S.h);g.addColorStop(0,b.bg[0]);g.addColorStop(1,b.bg[1]);X.fillStyle=g;X.fillRect(0,0,S.w,S.h);for(let i=0;i<30;i++){const z=i/30,x=((S.worldX*0.05*(1+z))%(S.w+200))-100,y=S.h*(0.14+z*0.55);X.fillStyle=`rgba(255,255,255,${0.02+z*0.06})`;X.beginPath();X.arc(x,y,1+z*2,0,7);X.fill()}}
function render(){drawBg();const b=BIOMES[S.biome];for(let i=0;i<12;i++){const x=((i*180-S.worldX*0.35)%(S.w+240))-120,base=S.h*0.78+Math.sin(i*1.9+S.t*1.2)*6;X.fillStyle='rgba(255,255,255,.05)';X.beginPath();X.moveTo(x,base);X.lineTo(x+90,base-40);X.lineTo(x+170,base);X.lineTo(x+170,base+100);X.lineTo(x,base+100);X.closePath();X.fill();X.fillStyle='rgba(0,0,0,.18)';X.fillRect(x+28,base-22,22,44)}if(S.biome===2){for(let i=0;i<6;i++){const x=((i*260-S.worldX*0.18)%(S.w+300))-150,y=S.h*0.35+Math.sin(i*2.2+S.t)*14;poly(x,y,42,5,'rgba(230,250,255,.12)',S.t*.1)}}const cx=S.w*0.33,cy=S.creatureY,g=S.growth;X.save();X.translate(cx,cy);X.scale(1+g*.28,1+g*.1);X.rotate(Math.sin(S.t*2)*.02);poly(18,26,78+g*30,8,'rgba(0,0,0,.2)',S.t*.3);X.fillStyle=b.fg;poly(0,0,72+g*42,7,b.fg,S.t*.2);poly(-16,-12,14+g*4,6,'rgba(255,255,255,.28)',S.t*1.2);X.fillStyle='#06111a';X.beginPath();X.arc(24,-8,9+g*2,0,7);X.fill();X.fillStyle='#fff';X.beginPath();X.arc(27,-10,2.2,0,7);X.fill();X.restore();for(const o of objs){const tw=S.t*4+o.phase;X.save();X.translate(o.x,o.y);X.rotate(Math.sin(tw)*0.08);if(o.t==='hazard')poly(0,0,26*o.s,3,o.c,tw);else if(o.t==='toxic')poly(0,0,18*o.s,6,o.c,tw);else poly(0,0,22*o.s,5,o.c,tw);if(o.t==='heavy'){X.fillStyle='rgba(255,255,255,.6)';X.fillRect(-8*o.s,-8*o.s,16*o.s,16*o.s)}X.restore()}if(S.flash>0){X.fillStyle=`rgba(255,255,255,${S.flash*3})`;X.fillRect(0,0,S.w,S.h)}X.fillStyle='rgba(0,0,0,.28)';X.fillRect(0,0,S.w,52)}
function ui(){const top=document.querySelector('.topbar')||(()=>{const d=document.createElement('div');d.className='hud topbar';d.innerHTML='<div class="pill">Score <span id=s>0</span> · Best <span id=b>0</span></div><div class="pill">Combo <span id=c>0</span> · Size <span id=z>0</span></div>';document.body.appendChild(d);return d})(),s=top.querySelector('#s'),b=top.querySelector('#b'),c=top.querySelector('#c'),z=top.querySelector('#z');s.textContent=(S.score|0).toLocaleString();b.textContent=(S.best|0).toLocaleString();c.textContent=S.combo;z.textContent=(S.growth*100|0)+'%';let ctd=document.querySelector('.center');if(!ctd){ctd=document.createElement('div');ctd.className='center';ctd.innerHTML='<h1 class="title">The Big Swallow</h1><p class="subtitle">Swallow the Sky</p><div class="barWrap"><div class="bar"></div></div><p class="help">Tap / click / swipe to swallow. Chain perfect bites to trigger speed bursts.<br><span class="small">Edible = bright shapes · Heavy = white cores · Toxic = green · Hazards = red</span></p>';document.body.appendChild(ctd)}const bar=ctd.querySelector('.bar');bar.style.width=Math.min(100,S.stomach*100)+'%';ctd.style.display=S.state==='title'||S.state==='gameover'?'block':'none';ctd.querySelector('.subtitle').textContent=S.state==='gameover'?'Run ended · tap to restart':'Swallow the Sky';const bot=document.querySelector('.bottom')||(()=>{const d=document.createElement('div');d.className='bottom';document.body.appendChild(d);return d})();bot.textContent=S.state==='gameover'?'Tap to try again':'Swipe or tap to bite'}
function loop(tm){const now=tm/1000;S.dt=Math.min(.033,now-(S.last||now));S.last=now;if(S.state==='title'&&P.press)reset();else if(S.state==='gameover'&&P.press)S.state='title';update(S.dt);render();ui();P.press=false;requestAnimationFrame(loop)}
function hit(e){const t=e.touches?e.touches[0]:e;P.down=true;P.press=true;P.startY=t.clientY}
function move(e){const t=e.touches?e.touches[0]:e;if(P.down&&S.state==='play'){const dy=t.clientY-P.startY;if(Math.abs(dy)>16){S.creatureY=Math.max(S.h*0.42,Math.min(S.h*0.84,S.creatureY+dy*0.18));P.startY=t.clientY}}}
function up(){P.down=false;if(S.state==='gameover')S.state='title'}addEventListener('mousedown',hit);addEventListener('mousemove',move);addEventListener('mouseup',up);addEventListener('touchstart',hit,{passive:false});addEventListener('touchmove',e=>{e.preventDefault();move(e)},{passive:false});addEventListener('touchend',up);addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='Enter'){P.press=true}if(e.code==='ArrowUp')S.creatureY-=18;if(e.code==='ArrowDown')S.creatureY+=18});requestAnimationFrame(loop)})();
</script></body></html>
