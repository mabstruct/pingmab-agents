<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>The Big Swallow</title>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#120f1f; font-family:system-ui,Segoe UI,Arial,sans-serif; }
  canvas { display:block; width:100vw; height:100vh; background: radial-gradient(circle at 50% 20%, #4c3c82 0%, #251c43 45%, #120f1f 100%); }
</style>
<script>
const canvas=document.createElement('canvas');const ctx=canvas.getContext('2d');document.body.appendChild(canvas);let W=0,H=0,DPR=1;
const state={mode:'menu',time:0,last:0,score:0,level:1,goal:250,wave:0,waveT:0,spawnT:0,rush:0,rushT:0,combo:0,comboT:0,shake:0,flash:0,message:'',messageT:0,currency:0,items:[],fx:[],orders:[],monster:{x:0,y:0,blink:0,burp:0,belly:0,over:false}};
const TYPES=[['burger','#ffb347',1,12],['taco','#ffd94d',1,10],['soda','#57d1ff',1,8],['donut','#ff78c4',1,11],['pickle','#65e07f',1,9],['spicy','#ff5a5a',2,15],['gold','#ffe66b',3,25],['vip','#b7a6ff',2,18]];
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=canvas.width=Math.floor(innerWidth*DPR);H=canvas.height=Math.floor(innerHeight*DPR);}window.addEventListener('resize',resize);resize();
function rand(a,b){return a+Math.random()*(b-a)}function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function dist(a,b,c,d){return Math.hypot(a-c,b-d)}
function drawRounded(x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.stroke()}}
function fxBurst(x,y,c){for(let i=0;i<10;i++)state.fx.push({x,y,vx:rand(-140,140),vy:rand(-140,120),t:rand(0.3,0.7),c})}
function fxText(txt,x,y,c){state.fx.push({txt,x,y,t:1,c,vy:-18})}
function addItem(type,x,y,targetOrder=-1){const t=TYPES[type];state.items.push({id:Math.random(),type,color:t[1],size:t[2],value:t[3],x,y,vx:rand(-25,25),vy:rand(-15,15),r:18+t[2]*5,alive:true,targetOrder,spin:rand(-4,4),stuck:0});}
function makeOrder(){const bag=[0,1,2,3,4,5];if(state.rush>0&&Math.random()<0.3)bag.push(6);if(Math.random()<0.08)bag.push(7);const count=1+Math.floor(Math.random()*Math.min(3,1+state.level));const req=[];for(let i=0;i<count;i++)req.push(bag[(Math.random()*bag.length)|0]);return{req,idx:0,t:18+count*4,done:false,vip:req.includes(7),gold:req.includes(6)};}
function reset(){state.time=0;state.score=0;state.level=1;state.goal=250;state.wave=0;state.waveT=0;state.spawnT=0;state.rush=0;state.rushT=0;state.combo=0;state.comboT=0;state.shake=0;state.flash=0;state.currency=0;state.items.length=0;state.fx.length=0;state.orders.length=0;state.mode='play';state.message='';state.monster.over=false;for(let i=0;i<2;i++)state.orders.push(makeOrder());state.waveInterval=4.8;}
function spawnWave(){state.wave++;const n=2+Math.min(4,Math.floor(state.level/2));for(let i=0;i<n;i++){const type=(Math.random()*5)|0;addItem(type,rand(40,W-40),rand(120,H-110));}if(Math.random()<0.3)addItem(5,rand(40,W-40),rand(120,H-110));if(state.rush>0&&Math.random()<0.5)addItem(6,rand(40,W-40),rand(120,H-110));if(Math.random()<0.18)addItem(7,rand(40,W-40),rand(120,H-110));}
function currentOrder(){return state.orders[0]||null}
function feedItem(item){const ord=currentOrder();const want=ord&&ord.req[ord.idx];let correct=ord&&item.type===want;let bonus=0;if(correct){ord.idx++;state.combo++;state.comboT=1.3;state.flash=0.2;state.shake=8;bonus=10+state.combo*4+item.value;if(ord.idx>=ord.req.length){state.orders.shift();state.orders.push(makeOrder());bonus+=30+state.level*3;state.message='Delivery cleared!';state.messageT=1.2;state.currency+=1;}}else{state.combo=0;state.comboT=0;state.flash=0.18;state.shake=14;state.message='Wrong snack!';state.messageT=1.1;state.monster.burp=0.4;state.monster.over=true;}
state.score+=Math.max(0,bonus);state.monster.belly=clamp(state.monster.belly+(correct?0.08:0.16),0,1.4);if(state.monster.belly>1.05){state.monster.over=true;state.shake+=4;}fxBurst(item.x,item.y,item.color);}
function nextLevel(){state.level++;state.goal=Math.floor(state.goal*1.28+140);state.rush=0;state.rushT=0;state.orders=[];for(let i=0;i<2+Math.min(2,Math.floor(state.level/2));i++)state.orders.push(makeOrder());state.message='Rush order upgraded!';state.messageT=1.3;}
function update(dt){state.time+=dt;state.monster.x=W*0.5;state.monster.y=H*0.68;state.monster.blink=Math.max(0,state.monster.blink-dt);state.monster.burp=Math.max(0,state.monster.burp-dt);state.comboT=Math.max(0,state.comboT-dt);if(state.comboT===0)state.combo=0;state.messageT=Math.max(0,state.messageT-dt);state.flash=Math.max(0,state.flash-dt);state.shake=Math.max(0,state.shake-dt*20);if(state.mode!=='play')return;
state.waveT+=dt;state.spawnT+=dt;state.rushT+=dt;for(const o of state.orders)o.t-=dt; if(state.rushT>20){state.rush=1; if(state.rushT>28){state.rush=0; state.rushT=0; state.message='Calm counter-current'; state.messageT=1.1;}}
state.waveInterval=clamp(4.8-state.level*0.12-(state.rush?1.4:0),1.8,5);if(state.spawnT>state.waveInterval){state.spawnT=0;spawnWave();}if(state.level>=3&&Math.random()<dt*0.12)state.orders.push(makeOrder());
for(let i=state.items.length-1;i>=0;i--){const it=state.items[i];it.x+=it.vx*dt;it.y+=it.vy*dt;it.vx*=Math.pow(0.985,dt*60);it.vy*=Math.pow(0.985,dt*60);it.spin+=dt*2; if(it.x<20||it.x>W-20)it.vx*=-1; if(it.y<90||it.y>H-80)it.vy*=-1; const m=state.monster; if(dist(it.x,it.y,m.x,m.y+30)<75+it.r*0.2&&Math.random()<dt*3){feedItem(it); state.items.splice(i,1); continue;}}
for(const o of state.orders){if(o.t<=0&&!o.done){o.done=true; state.combo=0; state.shake=10; state.flash=0.2; state.message='Order timed out!'; state.messageT=1.3; state.monster.over=true;}}
if(state.monster.over)state.monster.belly=Math.max(0,state.monster.belly-dt*0.15); if(state.monster.belly>1.25&&Math.random()<dt*2){state.monster.burp=0.3;state.shake+=2;fxText('BURP!',W*0.5,H*0.52,'#ffd76a'); state.monster.belly=1.0;}
if(state.score>=state.goal)nextLevel(); if(state.score<0)state.score=0;}
function render(){ctx.clearRect(0,0,W,H);ctx.save();if(state.shake>0)ctx.translate((Math.random()-0.5)*state.shake*DPR,(Math.random()-0.5)*state.shake*DPR);const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#5f49a6');bg.addColorStop(1,'#171229');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);ctx.fillStyle='rgba(255,255,255,0.05)';for(let i=0;i<8;i++)ctx.fillRect(i*W/8,0,2,H);ctx.fillStyle='#2a2148';ctx.fillRect(0,H*0.18,W,H*0.72);ctx.fillStyle='#3b2f63';ctx.fillRect(0,H*0.78,W,H*0.22);for(let i=0;i<6;i++){ctx.fillStyle=i%2?'#ff9f5b':'#7dffca';ctx.fillRect(i*W/6+20,H*0.82,40,12);}const panelX=W*0.03,panelY=H*0.11,panelW=Math.min(240,W*0.22),panelH=H*0.68;drawRounded(panelX,panelY,panelW,panelH,18,'rgba(18,15,31,0.72)','rgba(255,255,255,0.12)');ctx.fillStyle='#fff';ctx.font=`${Math.floor(18*DPR)}px sans-serif`;ctx.fillText('ORDER QUEUE',panelX+16,panelY+28);for(let i=0;i<state.orders.length;i++){const o=state.orders[i];const oy=panelY+48+i*92;drawRounded(panelX+10,oy,panelW-20,80,14,o.done?'rgba(90,255,145,0.18)':'rgba(255,255,255,0.08)');ctx.fillStyle=o.done?'#7dff95':'#fff';ctx.fillText(`Order ${i+1}${o.vip?' VIP':''}${o.gold?' GOLD':''}`,panelX+20,oy+22);for(let j=0;j<o.req.length;j++){const t=TYPES[o.req[j]];ctx.fillStyle=j<o.idx?'#7dff95':'#ffffff';ctx.beginPath();ctx.arc(panelX+32+j*34,oy+50,12,0,Math.PI*2);ctx.fill();ctx.fillStyle=t[1];ctx.beginPath();ctx.arc(panelX+32+j*34,oy+50,7,0,Math.PI*2);ctx.fill();}}
const m=state.monster;ctx.save();ctx.translate(m.x,m.y);const jaw=20+Math.sin(state.time*8)*2+(m.burp>0?12:0);drawRounded(-90,-20,180,120,54,'#62ff9d');ctx.fillStyle='#1d1433';ctx.beginPath();ctx.ellipse(0,15,76,jaw+40,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffefef';ctx.beginPath();ctx.arc(-28,-2,11,0,Math.PI*2);ctx.arc(28,-2,11,0,Math.PI*2);ctx.fill();ctx.fillStyle='#1d1433';ctx.beginPath();ctx.arc(-26,-1,4,0,Math.PI*2);ctx.arc(30,-1,4,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ff7ac8';ctx.fillRect(-72,62,144,18);ctx.fillStyle='#ffb1d8';ctx.fillRect(-58,68,116,8);ctx.restore();
for(const it of state.items){ctx.save();ctx.translate(it.x,it.y);ctx.rotate(it.spin);ctx.fillStyle=it.color;ctx.beginPath();ctx.arc(0,0,it.r,0,Math.PI*2);ctx.fill();ctx.fillStyle='rgba(255,255,255,0.35)';ctx.beginPath();ctx.arc(-it.r*0.25,-it.r*0.25,it.r*0.22,0,Math.PI*2);ctx.fill();ctx.fillStyle='#1d1433';ctx.font=`${Math.floor(12*DPR)}px sans-serif`;ctx.textAlign='center';ctx.fillText(TYPES[it.type][0],0,4);ctx.restore();}
ctx.fillStyle='rgba(18,15,31,0.6)';drawRounded(W*0.30,H*0.06,W*0.38,52,16,'rgba(18,15,31,0.65)','rgba(255,255,255,0.1)');ctx.fillStyle='#fff';ctx.font=`${Math.floor(18*DPR)}px sans-serif`;ctx.fillText(`Score ${Math.floor(state.score)} / ${state.goal}`,W*0.32,H*0.09);ctx.fillText(`Level ${state.level}`,W*0.56,H*0.09);const barX=W*0.31,barY=H*0.12,barW=W*0.36,barH=18;drawRounded(barX,barY,barW,barH,10,'rgba(255,255,255,0.15)');drawRounded(barX,barY,barW*clamp(state.score/state.goal,0,1),barH,10,'#7dff95');ctx.fillText('APPETITE',barX,barY-6);
const belly=clamp(state.monster.belly,0,1.4);drawRounded(W*0.42,H*0.80,W*0.16,18,8,'rgba(255,255,255,0.1)');drawRounded(W*0.42,H*0.80,W*0.16*clamp(belly,0,1),18,8,belly>1?'#ff6b7a':'#ffcf5a');ctx.fillStyle='#fff';ctx.fillText(belly>1?'OVERFED':'BELLY',W*0.42,H*0.795);
ctx.textAlign='center';for(const fx of state.fx){if(fx.txt){ctx.fillStyle=fx.c;ctx.font=`${Math.floor(18*DPR)}px sans-serif`;ctx.fillText(fx.txt,fx.x,fx.y);fx.y+=fx.vy*(1/60);fx.t-=1/60;}}state.fx=state.fx.filter(f=>f.t>0);
if(state.messageT>0){ctx.fillStyle='rgba(255,255,255,0.95)';ctx.font=`${Math.floor(22*DPR)}px sans-serif`;ctx.fillText(state.message,W*0.5,H*0.18);}ctx.textAlign='left';if(state.flash>0){ctx.fillStyle=`rgba(255,255,255,${state.flash})`;ctx.fillRect(0,0,W,H);}if(state.mode==='menu'){ctx.fillStyle='rgba(0,0,0,0.45)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font=`${Math.floor(38*DPR)}px sans-serif`;ctx.fillText('THE BIG SWALLOW',W*0.5,H*0.28);ctx.font=`${Math.floor(20*DPR)}px sans-serif`;ctx.fillText('Snack Attack: Monster Delivery',W*0.5,H*0.33);ctx.fillText('Click or tap the tasty chaos. Feed the monster in order!',W*0.5,H*0.42);ctx.fillText('Tap to begin',W*0.5,H*0.53);ctx.textAlign='left';}if(state.mode==='play'&&state.rush>0){ctx.fillStyle='rgba(255,80,110,0.12)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#ffd1d8';ctx.font=`${Math.floor(18*DPR)}px sans-serif`;ctx.fillText('RUSH PHASE!',W*0.45,H*0.22);}ctx.restore();}
function loop(t){if(!state.last)state.last=t;const dt=Math.min(0.033,(t-state.last)/1000);state.last=t;update(dt);render();requestAnimationFrame(loop);}requestAnimationFrame(loop);
canvas.addEventListener('pointerdown',e=>{const r=canvas.getBoundingClientRect();const x=(e.clientX-r.left)*DPR,y=(e.clientY-r.top)*DPR;if(state.mode==='menu'){state.mode='play';reset();return;}let clicked=false;for(let i=state.items.length-1;i>=0;i--){const it=state.items[i];if(dist(x,y,it.x,it.y)<it.r+10){feedItem(it);state.items.splice(i,1);clicked=true;break;}}if(!clicked){state.monster.burp=0.15;state.shake=2;}});
reset();
</script>
</body>
</html>
