<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>The Big Swallow</title>
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#09111a;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  canvas{display:block;width:100vw;height:100vh;touch-action:none;cursor:pointer}
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const C=document.getElementById('game'),X=C.getContext('2d');let W=0,H=0,DPR=1;const S={t:0,dt:0,mode:'title',score:0,hi:+localStorage.bigSwallowHi||0,coins:0,runCoins:0,shake:0,msg:'',msgT:0,world:[],debris:[],particles:[],bulges:[],upgrades:{jaw:0,swallow:0,resist:0},powers:{mega:0,vac:0,digest:0},spawn:0,city:0,combo:0,comboT:0,clog:0,clogMax:100,player:{x:0,y:0,vx:0,vy:0,r:32,targetX:0,targetY:0,energy:0,grow:0,dir:1,swallowing:0,flash:0},touch:{down:false,x:0,y:0,id:null},cam:{x:0,y:0},restarts:0};
function R(){DPR=Math.max(1,Math.min(2,devicePixelRatio||1));W=innerWidth;H=innerHeight;C.width=W*DPR;C.height=H*DPR;C.style.width=W+'px';C.style.height=H+'px';X.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',R);R();
function rnd(a,b){return a+Math.random()*(b-a)}function clamp(v,a,b){return v<a?a:v>b?b:v}function dist(a,b,c,d){const e=a-c,f=b-d;return Math.hypot(e,f)}function len(x,y){return Math.hypot(x,y)||1}function addPart(x,y,n,c,s){for(let i=0;i<n;i++)S.particles.push({x,y,vx:rnd(-s,s),vy:rnd(-s,s),r:rnd(2,6),t:rnd(.25,.8),c})}
function resetRun(){S.score=0;S.runCoins=0;S.shake=0;S.msg='';S.msgT=0;S.world=[];S.debris=[];S.particles=[];S.bulges=[];S.spawn=0;S.city=0;S.combo=0;S.comboT=0;S.clog=0;S.player.x=0;S.player.y=0;S.player.vx=0;S.player.vy=0;S.player.r=34+S.upgrades.jaw*3+S.powers.mega*8;S.player.targetX=0;S.player.targetY=0;S.player.energy=0;S.player.grow=0;S.player.dir=1;S.player.swallowing=0;S.player.flash=0;S.cam.x=0;S.cam.y=0;S.restarts++;for(let i=0;i<12;i++)spawnBlock(i*130-600)}
function spawnBlock(baseX){const lane=[-170,0,170][(Math.random()*3)|0];const kind=Math.random();let t='coin',r=12,v=0,h=0,c='#ffd84a';if(kind>.96){t='bomb';r=14;v=8;h=1;c='#ff5c6e'}else if(kind>.84){t='car';r=22;v=20;h=2;c='#56d6ff'}else if(kind>.68){t='cone';r=10;v=2;h=0;c='#ff8f3d'}else if(kind>.50){t='trash';r=15;v=6;h=0;c='#8f9ab3'}else if(kind>.38){t='sign';r=18;v=10;h=1;c='#77ffb2'}else if(kind>.25){t='crate';r=14;v=4;h=0;c='#c98a4f'}else if(kind>.12){t='tower';r=30;v=40;h=3;c='#d7e0ea'}else{t='block';r=rnd(18,30);v=14;h=1;c=['#8eb0d6','#a6d3c8','#f2c98f','#dca5c4'][((Math.random()*4)|0)]}S.world.push({x:baseX+rnd(-40,40),y:lane+rnd(-30,30),vx:rnd(-8,8),vy:rnd(-6,6),r,baseR:r,type:t,value:v,hp:h,c,alive:true,spin:rnd(-3,3),mass:1+r/18})}
function startGame(){S.mode='play';S.city=0;S.player.r=34+S.upgrades.jaw*3;resetRun()}
function swallow(o){S.score+=o.value*(1+S.combo*.15);S.runCoins+=o.value;S.combo++;S.comboT=1.5;S.player.grow+=o.value*0.02;S.player.energy=clamp(S.player.energy+o.value*0.02,0,1);S.player.swallowing=.18;S.player.flash=.12;S.shake=Math.min(14,S.shake+1.5);addPart(o.x,o.y,Math.min(12,o.value),o.c,110);S.bulges.push({t:0,r:o.r*.45});if(o.type==='coin')S.coins+=1;if(o.type==='bomb'){S.clog+=28;S.msg='BOMB BITE!';S.msgT=.9;addPart(o.x,o.y,20,'#ff9cab',160);S.shake=18}else if(o.type==='car'){S.clog+=8}else if(o.type==='tower'||o.type==='block'){S.clog+=4}if(S.clog>100){S.mode='dead';S.msg='GULLET JAM!';S.msgT=2;localStorage.bigSwallowHi=Math.max(S.hi,S.score|0);S.hi=+localStorage.bigSwallowHi;}}
function update(dt){S.t+=dt;const p=S.player;if(S.mode==='title'){p.r=34+Math.sin(S.t*3)*1.5;return}if(S.mode==='dead'){for(const a of S.particles){a.t-=dt;a.x+=a.vx*dt;a.y+=a.vy*dt;a.vy+=240*dt}S.particles=S.particles.filter(a=>a.t>0);return}const nx=(S.touch.down?S.touch.x-W*.5:0),ny=(S.touch.down?S.touch.y-H*.62:0);p.targetX+=((nx)+p.vx*0.02-p.targetX)*clamp(dt*8,0,1);p.targetY+=((ny)+p.vy*0.02-p.targetY)*clamp(dt*8,0,1);const ax=p.targetX*1.8-p.vx*.42,ay=p.targetY*1.8-p.vy*.42;const speed=190+S.upgrades.swallow*8+p.r*2.2+(S.powers.mega?70:0);p.vx+=ax*dt*1.25;p.vy+=ay*dt*1.25;const v=len(p.vx,p.vy),mx=speed*(S.powers.vac?1.25:1);if(v>mx){p.vx=p.vx/v*mx;p.vy=p.vy/v*mx}p.x+=p.vx*dt;p.y+=p.vy*dt;p.dir=p.vx<0?-1:1;p.r+=(34+S.upgrades.jaw*3+S.powers.mega*10+p.grow-p.r)*clamp(dt*4,0,1);p.grow*=Math.pow(.08,dt);p.swallowing=Math.max(0,p.swallowing-dt);p.flash=Math.max(0,p.flash-dt);S.cam.x+=(p.x-S.cam.x)*clamp(dt*3,0,1);S.cam.y+=(p.y-S.cam.y)*clamp(dt*3,0,1);S.spawn-=dt;S.city+=dt*25*(1+S.score*.0006);if(S.spawn<0){S.spawn=rnd(.2,.8);const n=2+((S.city/120)|0);for(let i=0;i<n;i++)spawnBlock(S.cam.x+rnd(460,980)+i*rnd(40,120))}for(const o of S.world){if(!o.alive)continue;o.x+=o.vx*dt;o.y+=o.vy*dt;o.vx*=Math.pow(.985,dt*60);o.vy*=Math.pow(.985,dt*60);const d=dist(p.x,p.y,o.x,o.y),eatR=p.r+(o.r*0.75);if(d<eatR){const can=p.r*1.08+(S.upgrades.jaw*2)+(S.powers.mega?30:0);if(o.r<can||o.type==='coin'||S.powers.vac){o.alive=false;swallow(o)}else{S.clog+=o.h?o.h*4:2;S.shake=6;addPart(o.x,o.y,8,'#fff',70);o.vx+=(o.x-p.x)*2;o.vy+=(o.y-p.y)*2;if(o.type==='bomb'&&d<o.r*1.2){o.alive=false;S.clog+=35;S.msg='TOXIC BURST!';S.msgT=1;addPart(o.x,o.y,24,'#ff5c6e',180)}}}else if(d<eatR+36&&o.type==='tower'&&Math.random()<dt*2){o.hp-=dt*2;o.vx+=(o.x-p.x)*.5;o.vy+=(o.y-p.y)*.5;if(o.hp<=0){o.alive=false;S.score+=40;S.shake=10;addPart(o.x,o.y,30,o.c,130)}}}
for(let i=0;i<S.world.length;i++)for(let j=i+1;j<S.world.length;j++){const a=S.world[i],b=S.world[j];if(!a.alive||!b.alive)continue;const d=dist(a.x,a.y,b.x,b.y),m=a.r+b.r;if(d<m&&d>0){const o=(m-d)/m*.5;const dx=(a.x-b.x)/d,dy=(a.y-b.y)/d;a.x+=dx*o*a.mass;b.x-=dx*o*b.mass;a.y+=dy*o*a.mass;b.y-=dy*o*b.mass;const s=(a.vx-b.vx)*dx+(a.vy-b.vy)*dy;if(s<0){const imp=-s*.12;a.vx+=dx*imp;b.vx-=dx*imp;a.vy+=dy*imp;b.vy-=dy*imp;if(imp>70&&(a.type==='tower'||b.type==='tower')){a.hp-=1;b.hp-=1;S.shake=4}}}}
for(const o of S.world){if(!o.alive&&Math.random()<dt*2){S.debris.push({x:o.x,y:o.y,vx:rnd(-60,60),vy:rnd(-100,-10),r:rnd(1,4),t:rnd(.5,1.2),c:o.c})}}S.world=S.world.filter(o=>o.alive&&Math.abs(o.x-S.cam.x)<1300&&Math.abs(o.y-S.cam.y)<900);for(const a of S.particles){a.t-=dt;a.x+=a.vx*dt;a.y+=a.vy*dt;a.vy+=260*dt}S.particles=S.particles.filter(a=>a.t>0);for(const a of S.debris){a.t-=dt;a.x+=a.vx*dt;a.y+=a.vy*dt;a.vy+=260*dt}S.debris=S.debris.filter(a=>a.t>0);for(const b of S.bulges)b.t+=dt;S.bulges=S.bulges.filter(b=>b.t<.7);S.comboT-=dt;if(S.comboT<=0)S.combo=0;S.clog=Math.max(0,S.clog-dt*(8+S.upgrades.resist*2+S.powers.digest*10));if(S.powers.mega>0)S.powers.mega-=dt;if(S.powers.vac>0)S.powers.vac-=dt;if(S.powers.digest>0)S.powers.digest-=dt;if(p.r>1100){S.mode='dead';S.msg='YOU ATE THE MAP';S.msgT=2}S.score=(p.r*p.r*0.08+S.runCoins*8+S.combo*20)|0;S.hi=Math.max(S.hi,S.score);localStorage.bigSwallowHi=S.hi;}
function drawCityGrid(){const p=S.player,ox=(-S.cam.x*0.35)%160,oy=(-S.cam.y*0.35)%160;X.lineWidth=2;for(let y=oy-160;y<H+160;y+=160)for(let x=ox-160;x<W+160;x+=160){X.strokeStyle='rgba(255,255,255,.04)';X.strokeRect(x,y,160,160)}}
function render(){const p=S.player;X.clearRect(0,0,W,H);const bg=X.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#0b1420');bg.addColorStop(1,'#17243b');X.fillStyle=bg;X.fillRect(0,0,W,H);drawCityGrid();const shake=S.shake>0?(Math.random()-0.5)*S.shake:0;if(S.shake>0)S.shake=Math.max(0,S.shake-1.2);X.save();X.translate(W/2+shake,H/2+shake);X.translate(-S.cam.x,-S.cam.y);for(const o of S.world){X.save();X.translate(o.x,o.y);X.rotate(o.spin*(S.t*.1));X.fillStyle=o.c;X.strokeStyle='#071019';X.lineWidth=4;X.beginPath();if(o.type==='car'){X.roundRect(-o.r*1.2,-o.r*.5,o.r*2.4,o.r,6);X.fill();X.stroke();X.fillStyle='#fff';X.fillRect(-o.r*.8,-o.r*.3,o.r*.6,o.r*.4)}else if(o.type==='tower'||o.type==='block'){X.roundRect(-o.r,-o.r,o.r*2,o.r*2,8);X.fill();X.stroke()}else{X.beginPath();X.arc(0,0,o.r,0,Math.PI*2);X.fill();X.stroke()}X.restore()}
for(const d of S.debris){X.fillStyle=d.c;X.beginPath();X.arc(d.x,d.y,d.r,0,Math.PI*2);X.fill()}for(const a of S.particles){X.globalAlpha=clamp(a.t,0,1);X.fillStyle=a.c;X.beginPath();X.arc(a.x,a.y,a.r,0,Math.PI*2);X.fill()}X.globalAlpha=1;for(const b of S.bulges){X.fillStyle='rgba(255,255,255,.16)';X.beginPath();X.arc(p.x,p.y,p.r+b.t*18,0,Math.PI*2);X.fill()}
X.save();X.translate(p.x,p.y);X.scale(p.dir,1);const wob=Math.sin(S.t*8)*2;X.fillStyle=p.flash>0?'#fff0a8':'#ffcc55';X.strokeStyle='#1c1022';X.lineWidth=6;X.beginPath();X.ellipse(0,0,p.r*1.05,p.r*.92+wob,0,0,Math.PI*2);X.fill();X.stroke();X.fillStyle='#111';X.beginPath();X.arc(p.r*.18,-p.r*.18,p.r*.11,0,Math.PI*2);X.arc(-p.r*.12,-p.r*.18,p.r*.11,0,Math.PI*2);X.fill();X.strokeStyle='#fff';X.lineWidth=5;X.beginPath();X.arc(p.r*.02,p.r*.08,p.r*.34,p.swallowing?Math.PI*1.1:Math.PI*1.25,p.swallowing?Math.PI*1.9:Math.PI*1.8);X.stroke();X.restore();X.restore();
X.fillStyle='rgba(0,0,0,.3)';X.fillRect(14,14,260,92);X.fillStyle='#fff';X.font='700 18px system-ui';X.fillText('Score '+(S.score|0),26,42);X.fillText('Hi '+(S.hi|0),26,66);X.fillStyle='#ffd24a';X.fillText('Combo x'+S.combo,26,90);X.fillStyle='#ff6c7a';X.fillRect(14,118,220,18);X.fillStyle='#39d98a';X.fillRect(14,118,220*(1-S.clog/100),18);X.strokeStyle='#fff';X.strokeRect(14,118,220,18);X.fillStyle='#fff';X.font='700 14px system-ui';X.fillText('Clog',244,132);const pw=[['JAW',S.upgrades.jaw],['SWL',S.upgrades.swallow],['RST',S.upgrades.resist]];for(let i=0;i<3;i++){X.fillStyle='rgba(0,0,0,.28)';X.fillRect(14+i*84,H-54,76,40);X.fillStyle='#fff';X.font='700 13px system-ui';X.fillText(pw[i][0],22+i*84,H-31);X.fillText('Lv '+pw[i][1],22+i*84,H-16)}if(S.mode==='title'||S.mode==='dead'){X.fillStyle='rgba(5,8,12,.56)';X.fillRect(0,0,W,H);X.fillStyle='#fff';X.textAlign='center';X.font='900 58px system-ui';X.fillText('THE BIG SWALLOW',W/2,H*.26);X.font='700 22px system-ui';X.fillText('Eat the World, One Swallow at a Time',W/2,H*.32);X.font='700 20px system-ui';X.fillText('Move by dragging. Swallow by colliding with smaller things.',W/2,H*.44);X.fillText('Bigger bites grow you. Bad bites clog your gullet.',W/2,H*.48);X.fillText('Tap to start / restart',W/2,H*.57);if(S.mode==='dead'){X.fillText(S.msg||'RUN OVER',W/2,H*.63);X.fillText('Final score '+(S.score|0)+'  •  Best '+(S.hi|0),W/2,H*.69)}}if(S.msgT>0){S.msgT-=S.dt;X.fillStyle='#fff';X.font='900 28px system-ui';X.textAlign='center';X.fillText(S.msg,W/2,86)}X.textAlign='left'}
function loop(ts){S.dt=Math.min(.033,(ts-(S._ts||ts))/1000);S._ts=ts;update(S.dt);render();requestAnimationFrame(loop)}requestAnimationFrame(loop);
addEventListener('pointerdown',e=>{S.touch.down=true;S.touch.x=e.clientX;S.touch.y=e.clientY;if(S.mode!=='play')startGame();else S.player.swallowing=.18});addEventListener('pointermove',e=>{if(S.touch.down){S.touch.x=e.clientX;S.touch.y=e.clientY}});addEventListener('pointerup',()=>{S.touch.down=false});addEventListener('keydown',e=>{if(e.code==='Space'){if(S.mode!=='play')startGame();else S.player.swallowing=.18}});
</script>
</body>
</html>
