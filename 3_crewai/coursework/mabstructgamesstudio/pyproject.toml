[project]
name = "mabstructgamesstudio"
version = "0.1.0"
description = "MabstructGamesStudio using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[anthropic,tools]==1.14.4",
    "langsmith[claude-agent-sdk,openai-agents]>=0.10.10",
    "tavily-python>=0.7.26",
]

[project.scripts]
mabstructgamesstudio = "mabstructgamesstudio.main:run"
run_crew = "mabstructgamesstudio.main:run"
train = "mabstructgamesstudio.main:train"
replay = "mabstructgamesstudio.main:replay"
deploy_game = "mabstructgamesstudio.main:deploy_game"
test = "mabstructgamesstudio.main:test"
run_with_trigger = "mabstructgamesstudio.main:run_with_trigger"

[tool.hatch.build.targets.wheel]
packages = ["src/mabstructgamesstudio"]

[tool.hatch.build.targets.wheel.force-include]
"src/mabstructgamesstudio/scripts" = "mabstructgamesstudio/scripts"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
