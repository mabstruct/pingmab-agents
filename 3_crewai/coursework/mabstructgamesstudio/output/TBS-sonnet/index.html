<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Big Swallow</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#05030c;overflow:hidden;
    font-family:'Trebuchet MS',sans-serif;color:#e8e0ff;user-select:none;}
  #wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;}
  canvas{display:block;background:#05030c;touch-action:none;}
  #hud{position:absolute;top:0;left:0;right:0;padding:14px 20px;
    pointer-events:none;display:flex;justify-content:space-between;
    font-size:14px;letter-spacing:1px;text-shadow:0 0 8px #000;}
  #stageName{font-size:18px;font-weight:bold;letter-spacing:3px;
    text-transform:uppercase;opacity:.9;}
  #massbar{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);
    width:260px;height:8px;background:rgba(255,255,255,.12);border-radius:6px;
    overflow:hidden;box-shadow:0 0 12px rgba(120,80,220,.4);}
  #massfill{height:100%;width:0%;
    background:linear-gradient(90deg,#6a3cff,#c46bff,#ff9ce8);
    transition:width .2s;}
  #msg{position:absolute;top:42%;left:0;right:0;text-align:center;
    font-size:34px;letter-spacing:6px;text-transform:uppercase;opacity:0;
    pointer-events:none;text-shadow:0 0 24px #b98cff;transition:opacity .8s;}
  #sub{position:absolute;top:52%;left:0;right:0;text-align:center;
    font-size:15px;letter-spacing:3px;opacity:0;transition:opacity .8s;color:#c9b8ff;}
  #start{position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#160a2e,#05030c);
    z-index:10;text-align:center;}
  #start h1{font-size:52px;letter-spacing:8px;margin:0;
    background:linear-gradient(90deg,#8a5cff,#ff9ce8,#7cf0ff);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 0 40px rgba(160,110,255,.5);}
  #start p{max-width:480px;line-height:1.6;color:#bcaadd;font-size:15px;}
  .btn{margin-top:18px;padding:12px 34px;font-size:16px;letter-spacing:2px;
    cursor:pointer;pointer-events:auto;border:1px solid #8a5cff;border-radius:30px;
    background:rgba(120,80,220,.15);color:#e8e0ff;text-transform:uppercase;
    transition:.2s;}
  .btn:hover{background:rgba(160,110,255,.35);box-shadow:0 0 20px #8a5cff;}
  .modes{display:flex;gap:16px;}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="hud">
  <div id="stageName">Pebble</div>
  <div id="score">Mass 0</div>
</div>
<div id="massbar"><div id="massfill"></div></div>
<div id="msg"></div>
<div id="sub"></div>
<div id="start">
  <h1>THE BIG SWALLOW</h1>
  <p><i>Feed the Void, Become the Cosmos.</i><br><br>
  You are The Maw — a newborn point of gravitational hunger.
  Drag to thrust. Swallow anything smaller than you to grow.
  Anything larger will tear you apart. Ascend through six stages of scale.</p>
  <div class="modes">
    <div class="btn" id="btnCampaign">Campaign</div>
    <div class="btn" id="btnZen">Zen</div>
  </div>
</div>
<script>
(function(){
"use strict";
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W=0,H=0;
function resize(){W=cv.width=window.innerWidth;H=cv.height=window.innerHeight;}
window.addEventListener('resize',resize);resize();

// ---- Stage definitions ----
const STAGES=[
 {name:"Pebble",       thresh:60,   bg:["#1a1208","#05030c"], col:"#c9b18a"},
 {name:"Rock",         thresh:200,  bg:["#141018","#05030c"], col:"#a9b0c0"},
 {name:"Planet-Eater", thresh:600,  bg:["#08161e","#05030c"], col:"#5fd0b0"},
 {name:"Star-Swallower",thresh:1600, bg:["#22120a","#05030c"], col:"#ffb35c"},
 {name:"Galaxy-Gulper",thresh:4200, bg:["#180a26","#05030c"], col:"#c07cff"},
 {name:"The Big Swallow",thresh:1e9, bg:["#0a0a1e","#05030c"], col:"#7cf0ff"}
];

// ---- Game State ----
const G={
  running:false, mode:"campaign", stage:0,
  maw:{x:0,y:0,vx:0,vy:0,mass:8},
  cam:{x:0,y:0,zoom:1,tzoom:1},
  objs:[], particles:[], strands:[],
  score:0, t:0, best:0,
  transition:0, dead:false, deadT:0,
  worldR:2200
};
function mawRadius(){return Math.max(6,Math.sqrt(G.maw.mass)*3.2);}
function gravRadius(){return mawRadius()*4.5;}
</script>
</body>
</html><script>
// ---- Utility ----
function rand(a,b){return a+Math.random()*(b-a);}
function TAU(){return Math.PI*2;}

// ---- Object spawning ----
function spawnObj(kind){
  const st=STAGES[G.stage];
  const a=rand(0,TAU()), d=rand(G.worldR*0.15,G.worldR);
  let x=G.maw.x+Math.cos(a)*d, y=G.maw.y+Math.sin(a)*d;
  let mass, type=kind||"rock";
  let base=G.maw.mass;
  const r=Math.random();
  if(r<0.55) mass=rand(base*0.15,base*0.85);          // safe food
  else if(r<0.80) mass=rand(base*0.85,base*1.05);      // risky near-miss
  else mass=rand(base*1.1,base*2.6);                   // dangerous
  // hazards
  let hazard=null;
  const hr=Math.random();
  if(hr<0.08){type="antimass";mass=rand(base*0.2,base*0.6);}
  else if(hr<0.14){type="pulsar";mass=rand(base*1.5,base*3);hazard="pulse";}
  else if(hr<0.19 && G.stage>=3){type="darkcloud";mass=rand(base*3,base*6);}
  else if(hr<0.24 && G.stage>=4){type="probe";mass=rand(base*0.3,base*0.7);hazard="flee";}
  return {x,y,vx:rand(-.3,.3),vy:rand(-.3,.3),mass,type,hazard,
    pulseT:rand(0,3),spin:rand(0,TAU()),hue:rand(0,360)};
}
function populate(n){
  G.objs=[];
  for(let i=0;i<n;i++)G.objs.push(spawnObj());
}

// ---- Start game ----
function startGame(mode){
  G.mode=mode;G.stage=0;G.running=true;G.dead=false;G.transition=0;
  G.maw={x:0,y:0,vx:0,vy:0,mass:8};
  G.score=0;G.t=0;G.particles=[];G.strands=[];
  G.cam={x:0,y:0,zoom:1,tzoom:1};
  populate(46);
  document.getElementById('start').style.display='none';
}
document.getElementById('btnCampaign').onclick=()=>startGame('campaign');
document.getElementById('btnZen').onclick=()=>startGame('zen');

// ---- Input: drag thrust ----
let dragging=false,dragX=0,dragY=0;
function pos(e){const t=e.touches?e.touches[0]:e;return{x:t.clientX,y:t.clientY};}
cv.addEventListener('mousedown',e=>{dragging=true;const p=pos(e);dragX=p.x;dragY=p.y;});
cv.addEventListener('touchstart',e=>{dragging=true;const p=pos(e);dragX=p.x;dragY=p.y;e.preventDefault();},{passive:false});
window.addEventListener('mousemove',e=>{if(dragging){const p=pos(e);dragX=p.x;dragY=p.y;}});
window.addEventListener('touchmove',e=>{if(dragging){const p=pos(e);dragX=p.x;dragY=p.y;}},{passive:false});
window.addEventListener('mouseup',()=>dragging=false);
window.addEventListener('touchend',()=>dragging=false);

function applyThrust(){
  if(!dragging||G.dead||G.transition>0)return;
  // direction from maw screen pos toward drag point
  const sx=W/2, sy=H/2;
  let dx=dragX-sx, dy=dragY-sy;
  const len=Math.hypot(dx,dy)||1;
  const power=0.9/Math.sqrt(G.maw.mass); // mass-based inertia
  G.maw.vx+=(dx/len)*power;
  G.maw.vy+=(dy/len)*power;
}
</script><script>
// ---- Effects ----
function burst(x,y,c,n,spd){
  for(let i=0;i<n;i++){const a=rand(0,TAU()),s=rand(.5,spd);
    G.particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,c});}
}
function showMsg(m,s){
  const M=document.getElementById('msg'),S=document.getElementById('sub');
  M.textContent=m;S.textContent=s||"";
  M.style.opacity=1;S.style.opacity=1;
  clearTimeout(showMsg._t);
  showMsg._t=setTimeout(()=>{M.style.opacity=0;S.style.opacity=0;},2200);
}

// ---- Spaghettification ----
function spaghettify(){
  G.dead=true;G.deadT=0;G.strands=[];
  const mr=mawRadius();
  for(let i=0;i<40;i++){
    const a=rand(0,TAU());
    G.strands.push({a,len:rand(mr,mr*3),grow:rand(2,6),
      hue:rand(240,320)});
  }
  showMsg("Spaghettified","Torn into strands of light...");
}
function reform(){
  G.dead=false;G.strands=[];
  G.maw.mass=Math.max(6,G.maw.mass*0.55);
  G.maw.vx=G.maw.vy=0;
  // possibly drop a stage
  if(G.stage>0 && G.maw.mass<STAGES[G.stage-1].thresh){G.stage--;
    document.getElementById('stageName').textContent=STAGES[G.stage].name;}
  burst(G.maw.x,G.maw.y,"#b98cff",50,4);
}

// ---- Stage transition ----
function ascend(){
  G.stage++;
  const st=STAGES[G.stage];
  G.transition=1; // 1 -> 0 over time
  G.cam.tzoom=0.25; // zoom way out for reveal
  document.getElementById('stageName').textContent=st.name;
  showMsg("Ascension",st.name);
  burst(G.maw.x,G.maw.y,st.col,80,6);
  G.worldR*=1.35;
}

// ---- Update ----
function update(dt){
  applyThrust();
  const maw=G.maw, mr=mawRadius(), gr=gravRadius();

  if(G.dead){
    G.deadT+=dt;
    if(G.deadT>2.4)reform();
    updateParticles(dt);return;
  }

  // maw movement + drag
  maw.vx*=0.995;maw.vy*=0.995;
  maw.x+=maw.vx;maw.y+=maw.vy;

  // world timer / mass drift score
  G.t+=dt;

  // transition easing
  if(G.transition>0){
    G.transition-=dt*0.55;
    if(G.transition<=0){G.transition=0;G.cam.tzoom=1;populate(48);}
  }

  // objects
  for(let i=G.objs.length-1;i>=0;i--){
    const o=G.objs[i];
    // pulsar pulse push
    if(o.hazard==="pulse"){
      o.pulseT-=dt;
      if(o.pulseT<=0){o.pulseT=rand(2.5,4);
        const dx=maw.x-o.x,dy=maw.y-o.y,d=Math.hypot(dx,dy)||1;
        if(d<gr*3){const f=8/(1+d*0.01);maw.vx+=dx/d*f;maw.vy+=dy/d*f;
          o.flash=1;}
      }
    }
    if(o.flash)o.flash=Math.max(0,o.flash-dt*2);
    // probe flees
    if(o.hazard==="flee"){
      const dx=o.x-maw.x,dy=o.y-maw.y,d=Math.hypot(dx,dy)||1;
      if(d<gr*2){o.vx+=dx/d*0.15;o.vy+=dy/d*0.15;}
      o.vx*=0.98;o.vy*=0.98;
    }
    o.x+=o.vx;o.y+=o.vy;o.spin+=0.01;

    // gravity pull toward maw
    const dx=maw.x-o.x,dy=maw.y-o.y,d=Math.hypot(dx,dy)||1;
    const isCloud=(o.type==="darkcloud");
    if(d<gr && !isCloud){
      const pull=(gr-d)/gr*0.35*(mr/(mr+objR(o)));
      o.vx+=dx/d*pull;o.vy+=dy/d*pull;
    }
    // collision
    const rr=mr+objR(o);
    if(d<rr){
      if(o.mass>maw.mass){ // too big -> death (unless it's a small food)
        if(o.type!=="darkcloud"){spaghettify();return;}
      } else {
        // swallow!
        eat(o);G.objs.splice(i,1);
        G.objs.push(spawnObj());
        continue;
      }
    }
    // respawn far strays
    if(d>G.worldR*1.6){G.objs.splice(i,1);G.objs.push(spawnObj());}
  }

  // check ascension
  if(G.maw.mass>=STAGES[G.stage].thresh && G.stage<STAGES.length-1 && G.transition<=0){
    ascend();
  }

  // camera follows
  G.cam.x+=(maw.x-G.cam.x)*0.06;
  G.cam.y+=(maw.y-G.cam.y)*0.06;
  // base zoom shrinks as you grow so field feels vast
  const growZoom=Math.max(0.35,1-Math.log(G.maw.mass/8+1)*0.08);
  const targ=(G.transition>0?G.cam.tzoom:growZoom);
  G.cam.zoom+=(targ-G.cam.zoom)*0.04;

  updateParticles(dt);

  // HUD
  const st=STAGES[G.stage],prev=G.stage>0?STAGES[G.stage-1].thresh:0;
  const frac=Math.min(1,(G.maw.mass-prev)/(st.thresh-prev));
  document.getElementById('massfill').style.width=(frac*100)+'%';
  document.getElementById('score').textContent='Mass '+Math.floor(G.score);
}
function objR(o){return Math.max(4,Math.sqrt(o.mass)*3.2);}
function eat(o){
  const gain=o.type==="antimass"?-o.mass*0.4:o.mass*0.35;
  // near-miss bonus: bigger reward closer to your mass
  let bonus=1;
  if(o.type!=="antimass"){const ratio=o.mass/G.maw.mass; if(ratio>0.7)bonus=1.6;}
  G.maw.mass=Math.max(6,G.maw.mass+gain*bonus);
  if(gain>0)G.score+=o.mass*bonus;
  burst(o.x,o.y,o.type==="antimass"?"#ff4d6d":STAGES[G.stage].col,
    o.type==="antimass"?24:18,3);
}
function updateParticles(dt){
  for(let i=G.particles.length-1;i>=0;i--){
    const p=G.particles[i];p.x+=p.vx;p.y+=p.vy;p.vx*=.95;p.vy*=.95;
    p.life-=dt*1.2;if(p.life<=0)G.particles.splice(i,1);
  }
}
</script><script>
// ---- Rendering ----
let stars=[];
function initStars(){stars=[];for(let i=0;i<220;i++)
  stars.push({x:rand(-1,1),y:rand(-1,1),z:rand(.2,1),s:rand(.4,1.8)});}
initStars();

function w2s(x,y){const z=G.cam.zoom;
  return[(x-G.cam.x)*z+W/2,(y-G.cam.y)*z+H/2];}

function drawObj(o){
  const [sx,sy]=w2s(o.x,o.y);const r=objR(o)*G.cam.zoom;
  if(sx<-100||sx>W+100||sy<-100||sy>H+100)return;
  const bigger=o.mass>G.maw.mass;
  ctx.save();ctx.translate(sx,sy);ctx.rotate(o.spin);
  if(o.type==="antimass"){
    ctx.fillStyle="rgba(255,60,110,.9)";
    ctx.shadowColor="#ff2d55";ctx.shadowBlur=25;
    ctx.beginPath();ctx.arc(0,0,r,0,TAU());ctx.fill();
    ctx.strokeStyle="rgba(0,0,0,.6)";ctx.lineWidth=2;
    for(let i=0;i<4;i++){ctx.beginPath();
      ctx.moveTo(-r,rand(-r,r));ctx.lineTo(r,rand(-r,r));ctx.stroke();}
  } else if(o.type==="pulsar"){
    const f=o.flash||0;
    ctx.shadowColor="#7cf0ff";ctx.shadowBlur=20+f*40;
    ctx.fillStyle="#bfeaff";ctx.beginPath();ctx.arc(0,0,r,0,TAU());ctx.fill();
    ctx.strokeStyle=`rgba(140,240,255,${.4+f*.5})`;ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(0,0,r*(1.6+f*2),0,TAU());ctx.stroke();
  } else if(o.type==="darkcloud"){
    const g=ctx.createRadialGradient(0,0,0,0,0,r);
    g.addColorStop(0,"rgba(30,10,50,.85)");g.addColorStop(1,"rgba(10,4,20,0)");
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,r,0,TAU());ctx.fill();
  } else if(o.type==="probe"){
    ctx.fillStyle="#9effa0";ctx.shadowColor="#4dff6a";ctx.shadowBlur=15;
    ctx.beginPath();for(let i=0;i<3;i++){const a=i/3*TAU();
      ctx[i?'lineTo':'moveTo'](Math.cos(a)*r,Math.sin(a)*r);}
    ctx.closePath();ctx.fill();
  } else {
    // rock/planet/star styled by stage
    const st=STAGES[G.stage];
    const g=ctx.createRadialGradient(-r*.3,-r*.3,r*.1,0,0,r);
    g.addColorStop(0,shade(st.col,40));g.addColorStop(1,shade(st.col,-40));
    ctx.fillStyle=g;
    if(bigger){ctx.shadowColor="#ff5a5a";ctx.shadowBlur=18;}
    ctx.beginPath();ctx.arc(0,0,r,0,TAU());ctx.fill();
    if(G.stage>=2){ // rings on planet+ stages
      ctx.strokeStyle=shade(st.col,10);ctx.lineWidth=Math.max(1,r*.12);
      ctx.beginPath();ctx.ellipse(0,0,r*1.7,r*.5,0.4,0,TAU());ctx.stroke();
    }
  }
  ctx.restore();
  // danger ring
  if(bigger && o.type!=="darkcloud"){
    ctx.strokeStyle="rgba(255,80,80,.35)";ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(sx,sy,r+6,0,TAU());ctx.stroke();
  }
}
function shade(hex,amt){
  const c=hex.replace('#','');
  let r=parseInt(c.substr(0,2),16)+amt,g=parseInt(c.substr(2,2),16)+amt,b=parseInt(c.substr(4,2),16)+amt;
  r=Math.max(0,Math.min(255,r));g=Math.max(0,Math.min(255,g));b=Math.max(0,Math.min(255,b));
  return`rgb(${r},${g},${b})`;
}

function drawMaw(){
  const [sx,sy]=w2s(G.maw.x,G.maw.y);
  const mr=mawRadius()*G.cam.zoom, gr=gravRadius()*G.cam.zoom;
  if(G.dead){
    // strands
    for(const s of G.strands){
      s.len+=s.grow;
      ctx.strokeStyle=`hsla(${s.hue},80%,70%,${Math.max(0,1-G.deadT/2.4)})`;
      ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(sx,sy);
      ctx.lineTo(sx+Math.cos(s.a)*s.len,sy+Math.sin(s.a)*s.len);ctx.stroke();
    }
    return;
  }
  // gravity well distortion ring
  const gwell=ctx.createRadialGradient(sx,sy,mr,sx,sy,gr);
  gwell.addColorStop(0,"rgba(120,80,220,.18)");
  gwell.addColorStop(1,"rgba(120,80,220,0)");
  ctx.fillStyle=gwell;ctx.beginPath();ctx.arc(sx,sy,gr,0,TAU());ctx.fill();
  ctx.strokeStyle="rgba(160,120,255,.25)";ctx.lineWidth=1;
  ctx.beginPath();ctx.arc(sx,sy,gr,0,TAU());ctx.stroke();
  // corona
  const cg=ctx.createRadialGradient(sx,sy,mr*.2,sx,sy,mr*1.8);
  cg.addColorStop(0,STAGES[G.stage].col);
  cg.addColorStop(.5,"rgba(120,60,200,.5)");
  cg.addColorStop(1,"rgba(0,0,0,0)");
  ctx.fillStyle=cg;ctx.beginPath();ctx.arc(sx,sy,mr*1.8,0,TAU());ctx.fill();
  // void core
  ctx.fillStyle="#000";ctx.beginPath();ctx.arc(sx,sy,mr,0,TAU());ctx.fill();
  ctx.strokeStyle=STAGES[G.stage].col;ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(sx,sy,mr,0,TAU());ctx.stroke();
}

function render(){
  const st=STAGES[G.stage];
  const bg=ctx.createRadialGradient(W/2,H*.4,0,W/2,H*.4,Math.max(W,H));
  bg.addColorStop(0,st.bg[0]);bg.addColorStop(1,st.bg[1]);
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  // parallax stars
  for(const s of stars){
    const px=((s.x*W - G.cam.x*s.z*0.05)%W+W)%W;
    const py=((s.y*H - G.cam.y*s.z*0.05)%H+H)%H;
    ctx.globalAlpha=s.z*0.8;ctx.fillStyle="#fff";
    ctx.fillRect(px,py,s.s,s.s);
  }
  ctx.globalAlpha=1;
  for(const o of G.objs)drawObj(o);
  drawMaw();
  // particles
  for(const p of G.particles){
    const[sx,sy]=w2s(p.x,p.y);
    ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;
    ctx.beginPath();ctx.arc(sx,sy,2.5*G.cam.zoom+1,0,TAU());ctx.fill();
  }
  ctx.globalAlpha=1;
}
</script><script>
// ---- Main loop ----
let last=performance.now();
function loop(now){
  let dt=(now-last)/1000; last=now;
  if(dt>0.05)dt=0.05;
  if(G.running){update(dt);render();}
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// Idle title backdrop animation
(function idle(){
  if(!G.running){
    const bg=ctx.createRadialGradient(W/2,H*.4,0,W/2,H*.4,Math.max(W,H));
    bg.addColorStop(0,"#160a2e");bg.addColorStop(1,"#05030c");
    ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  }
  requestAnimationFrame(idle);
})();
})();
</script>
</body>
</html>
