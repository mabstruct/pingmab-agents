[project]
name = "sp"
version = "0.1.0"
description = "sp using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.14.4"
]

[project.scripts]
sp = "sp.main:run"
run_crew = "sp.main:run"
train = "sp.main:train"
replay = "sp.main:replay"
test = "sp.main:test"
run_with_trigger = "sp.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
